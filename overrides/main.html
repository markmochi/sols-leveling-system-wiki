{% extends "base.html" %}

{% block announce %}
  <div class="codex-rail" role="note" aria-label="Supported Minecraft versions">
    <a class="codex-rail__seal" href="{{ 'changelog/' | url }}">SLS v1.0.0</a>
    <span><b>Forge</b> 1.16.5</span>
    <span><b>Forge</b> 1.20.1</span>
    <span><b>NeoForge</b> 1.21.1</span>

    </div>
    <nav class="codex-footer__links" aria-label="Project links">
      <a href="{{ config.site_url }}reference/reporting-issues/">Report a bug</a>
      <a href="https://github.com/markmochi/sols-leveling-system-wiki/issues">Issues</a>
      <a href="https://github.com/markmochi/sols-leveling-system-wiki">GitHub</a>
